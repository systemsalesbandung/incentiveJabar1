<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Insentif Jabar1 - Mobile Mode</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background: linear-gradient(135deg, #f3f4f6 0%, #e5e7eb 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 15px;
        }

        /* Container Handphone Frame */
        .mobile-container {
            width: 100%;
            max-width: 390px;
            background: #ffffff;
            border-radius: 36px;
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.12);
            overflow: hidden;
            position: relative;
            border: 8px solid #1f2937;
        }

        /* Header Kecil dengan Gradasi Ungu, Putih, Orange */
        .header-bg {
            background: linear-gradient(135deg, #6d28d9 0%, #fdf2f8 50%, #ea580c 100%);
            padding: 24px 15px 22px 15px;
            text-align: center;
            color: #1f2937;
            border-bottom-left-radius: 24px;
            border-bottom-right-radius: 24px;
            position: relative;
            box-shadow: 0 4px 15px rgba(109, 40, 217, 0.1);
        }

        .header-bg h2 {
            font-size: 10px;
            font-weight: 700;
            letter-spacing: 1px;
            margin-bottom: 2px;
            text-transform: uppercase;
            color: #4c1d95;
        }

        .header-bg h1 {
            font-size: 15px;
            font-weight: 700;
            color: #ffffff;
            text-shadow: 0 2px 4px rgba(0,0,0,0.15);
            margin-bottom: 2px;
            letter-spacing: 0.3px;
        }

        .header-bg p {
            font-size: 10px;
            color: #ffffff;
            font-weight: 500;
            text-shadow: 0 1px 2px rgba(0,0,0,0.1);
            opacity: 0.95;
        }

        /* Ornamen Halus di Header */
        .header-ornament {
            position: absolute;
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            top: -15px;
            right: -15px;
        }

        /* Konten Menu Utama */
        .content-body {
            padding: 22px 18px 28px 18px;
        }

        .menu-title {
            font-size: 11px;
            font-weight: 600;
            color: #9ca3af;
            margin-bottom: 12px;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            text-align: center;
        }

        /* Grid Layout Kiri & Kanan */
        .menu-grid {
            display: flex;
            gap: 12px;
        }

        /* Kartu Menu Soft & Berkelas */
        .menu-card {
            flex: 1;
            background: #ffffff;
            border: 1px solid #f3f4f6;
            border-radius: 20px;
            padding: 16px 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            text-align: center;
            text-decoration: none;
            color: #1f2937;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.04);
            position: relative;
        }

        .menu-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 25px rgba(109, 40, 217, 0.12);
            border-color: #ddd6fe;
        }

        /* Icon Mewah dengan Soft Gradient */
        .menu-icon {
            width: 44px;
            height: 44px;
            background: linear-gradient(135deg, #7c3aed 0%, #a78bfa 100%);
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 17px;
            margin-bottom: 10px;
            box-shadow: 0 6px 15px rgba(124, 58, 237, 0.25);
        }

        /* Supervisor Icon dengan Nuansa Soft Orange/Emerald */
        .menu-card.supervisor .menu-icon {
            background: linear-gradient(135deg, #ea580c 0%, #fb923c 100%);
            box-shadow: 0 6px 15px rgba(234, 88, 12, 0.25);
        }

        .menu-info h3 {
            font-size: 12px;
            font-weight: 700;
            color: #111827;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        /* Badge OJT, AE PRO, AE ELITE Bergaya Soft */
        .badge-container {
            display: flex;
            flex-direction: column;
            gap: 4px;
            width: 100%;
        }

        .ae-badge {
            font-size: 9px;
            font-weight: 600;
            padding: 4px 6px;
            background: #faf5ff;
            color: #6b21a8;
            border: 1px solid #f3e8ff;
            border-radius: 8px;
            letter-spacing: 0.3px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            transition: all 0.2s;
        }

        .ae-badge i {
            font-size: 9px;
        }

        /* Warna Ikon Badge yang Lembut & Harmonis */
        .ae-badge.ojt i { color: #d97706; }
        .ae-badge.pro i { color: #2563eb; }
        .ae-badge.elite i { color: #7c3aed; }

        .ae-badge:hover {
            background: #f3e8ff;
        }

        .spv-desc {
            font-size: 10px;
            color: #6b7280;
            margin-top: 4px;
            line-height: 1.3;
            background: #fff7ed;
            padding: 6px 4px;
            border-radius: 8px;
            border: 1px solid #ffedd5;
            width: 100%;
        }

        .spv-desc i {
            color: #ea580c;
        }

        /* Footer Info */
        .footer-info {
            text-align: center;
            margin-top: 20px;
            font-size: 10px;
            color: #9ca3af;
            letter-spacing: 0.3px;
        }

        /* Indikator Poni Handphone */
        .phone-notch {
            width: 110px;
            height: 18px;
            background: #1f2937;
            position: absolute;
            top: 0;
            left: 50%;
            transform: translateX(-50%);
            border-bottom-left-radius: 10px;
            border-bottom-right-radius: 10px;
            z-index: 10;
        }
    </style>
</head>
<body>

    <div class="mobile-container">
        <!-- Poni Layar HP -->
        <div class="phone-notch"></div>

        <!-- Header Ringkas (Ungu - Putih - Orange) -->
        <div class="header-bg">
            <div class="header-ornament"></div>
            <h2>Kalkulator Perhitungan</h2>
            <h1>Insentif Jabar1</h1>
            <p>Pilih Akses Menu Anda</p>
        </div>

        <!-- Body Content -->
        <div class="content-body">
            <div class="menu-title">Menu Utama</div>

            <!-- Menu Kiri & Kanan -->
            <div class="menu-grid">
                <!-- Menu Kiri: Account Executive -->
                <a href="#" class="menu-card" onclick="alert('Mengarahkan ke Dashboard Account Executive')">
                    <div class="menu-icon">
                        <i class="fa-solid fa-user-tie"></i>
                    </div>
                    <div class="menu-info">
                        <h3>Account Executive</h3>
                        <div class="badge-container">
                            <span class="ae-badge ojt"><i class="fa-solid fa-seedling"></i> OJT</span>
                            <span class="ae-badge pro"><i class="fa-solid fa-bolt"></i> AE PRO</span>
                            <span class="ae-badge elite"><i class="fa-solid fa-crown"></i> AE ELITE</span>
                        </div>
                    </div>
                </a>

                <!-- Menu Kanan: Supervisor -->
                <a href="#" class="menu-card supervisor" onclick="alert('Mengarahkan ke Dashboard Supervisor')">
                    <div class="menu-icon">
                        <i class="fa-solid fa-user-shield"></i>
                    </div>
                    <div class="menu-info">
                        <h3>Supervisor</h3>
                        <div class="spv-desc">
                            <i class="fa-solid fa-chart-line"></i> Monitoring & Validasi
                        </div>
                    </div>
                </a>
            </div>

            <div class="footer-info">
                <p>&copy; 2026 Jabar1 Management System</p>
            </div>
        </div>
    </div>

</body>
</html>
